<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Heatmap Globe</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; }
  </style>
</head>
<body>

<!-- Three.js -->
<script src="https://unpkg.com/three@0.126.1/build/three.min.js"></script>

<!-- Globe.gl -->
<script src="https://unpkg.com/globe.gl"></script>

<script>
  const globe = Globe()
    (document.body)
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
    .backgroundColor('#000');

  // 🌍 HEATMAP DATA (EDIT THIS)
  const heatData = [
    { lat: 40.7128, lng: -74.0060, value: 0.9 }, // NYC
    { lat: 34.0522, lng: -118.2437, value: 0.7 }, // LA
    { lat: 51.5074, lng: -0.1278, value: 0.8 }, // London
    { lat: 35.6762, lng: 139.6503, value: 1.0 }, // Tokyo
    { lat: 48.8566, lng: 2.3522, value: 0.6 }  // Paris
  ];

  // 🔥 HEATMAP LAYER
  globe
    .heatmapsData([heatData])
    .heatmapPointLat(d => d.lat)
    .heatmapPointLng(d => d.lng)
    .heatmapPointWeight(d => d.value)
    .heatmapBandwidth(2.5) // spread size
    .heatmapColorFn((val) => {
      // custom gold heatmap gradient
      return val < 0.3 ? "rgba(255,215,0,0.1)" :
             val < 0.6 ? "rgba(255,215,0,0.4)" :
             val < 0.8 ? "rgba(255,215,0,0.7)" :
                         "rgba(255,215,0,1)";
    });

  // ✨ Optional glowing points
  globe.pointsData(heatData)
    .pointColor(() => "gold")
    .pointAltitude(0.02)
    .pointRadius(0.4);

</script>

</body>
</html>
