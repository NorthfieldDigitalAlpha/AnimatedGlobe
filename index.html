<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Globe</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; }
  </style>
</head>
<body>

<!-- THREE -->
<script src="https://unpkg.com/three@0.126.1/build/three.min.js"></script>

<!-- GLOBE -->
<script src="https://unpkg.com/globe.gl"></script>

<script>
  const world = Globe()
    (document.body)
    .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg')
    .backgroundColor('#000');

  // Golden arcs
  world.arcsData([
    { startLat: 40.7128, startLng: -74.0060, endLat: 51.5074, endLng: -0.1278 },
    { startLat: 34.0522, startLng: -118.2437, endLat: 35.6762, endLng: 139.6503 }
  ])
  .arcColor(() => 'gold')
  .arcDashLength(0.4)
  .arcDashGap(0.2)
  .arcDashAnimateTime(2000);

  // Glowing points
  world.pointsData([
    { lat: 40.7128, lng: -74.0060 },
    { lat: 51.5074, lng: -0.1278 },
    { lat: 35.6762, lng: 139.6503 }
  ])
  .pointColor(() => 'gold')
  .pointAltitude(0.02)
  .pointRadius(0.5);

</script>

</body>
</html>
