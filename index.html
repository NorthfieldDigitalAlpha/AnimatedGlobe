<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animated Globe</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three-globe@4.10.9/dist/three-globe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/controls/OrbitControls.min.js"></script>

<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.z = 200;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableZoom = false;
  controls.enablePan = false;

  const Globe = new ThreeGlobe()
    .globeImageUrl('https://raw.githubusercontent.com/visualcortex/globe.gl/master/example/img/earth-dark.jpg')
    .bumpImageUrl('https://raw.githubusercontent.com/visualcortex/globe.gl/master/example/img/earth-topology.png')
    .showAtmosphere(true)
    .atmosphereColor('gold')
    .atmosphereAltitude(0.25);

  scene.add(Globe);

  const arcsData = [
    { startLat: 40.7128, startLng: -74.0060, endLat: 51.5074, endLng: -0.1278 },
    { startLat: 35.6895, startLng: 139.6917, endLat: 48.8566, endLng: 2.3522 },
    { startLat: -33.8688, startLng: 151.2093, endLat: 37.7749, endLng: -122.4194 }
  ];

  Globe.arcsData(arcsData)
       .arcColor(() => 'gold')
       .arcAltitude(0.2)
       .arcStroke(0.5)
       .arcDashLength(0.4)
       .arcDashGap(0.3)
       .arcDashInitialGap(() => Math.random())
       .arcDashAnimateTime(2000);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));

  const light = new THREE.DirectionalLight(0xffffff, 0.6);
  light.position.set(100, 100, 100);
  scene.add(light);

  function animate() {
    Globe.rotation.y += 0.001;
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

</body>
</html>
